[project]
name = "invoice-worker"
version = "0.1.0"
description = "Document reader for Invoice Extractor: text layer, OCR and field extraction"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.149",
    "httpx>=0.28",
    "numpy>=2.5",
    "opencv-python-headless>=5.0",
    "pillow>=13",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pymupdf>=2.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "matplotlib>=3.10",
    "mypy>=2.4",
    "num2words>=0.5",
    "pytest>=9.1",
    "reportlab>=5.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_worker"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
platform = "linux"
strict = true
mypy_path = "src"
packages = ["invoice_worker"]

[[tool.mypy.overrides]]
module = ["pytesseract", "cv2", "pymupdf", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: needs the tesseract binary"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient"]

[[tool.mypy.overrides]]
module = ["invoice_worker.documents"]
disallow_untyped_calls = false
